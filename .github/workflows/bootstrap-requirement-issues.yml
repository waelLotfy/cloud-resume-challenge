name: Bootstrap Requirement Issues

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create labels + issues from requirements
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // ---------- Config ----------
            const functionalPath = 'docs/requirements/functional-requirements.md';
            const nonFunctionalPath = 'docs/requirements/non-functional-requirements.md';
            const architecturePath = 'docs/architecture/architecture-overview.md';

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const baseBlobUrl = `https://github.com/${owner}/${repo}/blob/${context.ref.replace('refs/heads/', '')}`;

            // Labels required by you
            const REQUIRED_LABELS = [
              // Type
              { name: 'type:functional', color: '1D76DB', description: 'Functional requirement' },
              { name: 'type:non-functional', color: '5319E7', description: 'Non-functional requirement' },

              // Tier
              { name: 'tier:presentation', color: '0052CC', description: 'Presentation tier' },
              { name: 'tier:logic', color: '0E8A16', description: 'Logic tier' },
              { name: 'tier:data', color: 'FBCA04', description: 'Data tier' },
              { name: 'tier:cross-cutting', color: 'D93F0B', description: 'Cross-cutting concern' },

              // Status
              { name: 'status:not-started', color: 'BFDADC', description: 'Not started yet' },

              // V-Model stage
              { name: 'stage:design', color: 'C2E0C6', description: 'Design stage' },
              { name: 'stage:implementation', color: 'F9D0C4', description: 'Implementation stage' },
              { name: 'stage:testing', color: 'FEF2C0', description: 'Testing stage' },
            ];

            // FR/NFR -> Tier mapping (adjust anytime)
            const TIER_MAP = {
              FR1:'presentation', FR2:'presentation', FR3:'presentation', FR4:'presentation', FR5:'presentation',
              FR6:'presentation', FR7:'presentation', FR8:'presentation', FR9:'presentation', FR10:'presentation',
              FR11:'presentation',
              FR12:'data',
              FR13:'cross-cutting',
              FR14:'logic', FR15:'logic', FR16:'logic',
              FR17:'cross-cutting', FR18:'cross-cutting', FR19:'cross-cutting', FR20:'cross-cutting',
              FR21:'cross-cutting', FR22:'cross-cutting', FR23:'cross-cutting', FR24:'cross-cutting', FR25:'cross-cutting',
              NFR1:'presentation',
              NFR2:'cross-cutting',
              NFR3:'cross-cutting',
              NFR4:'cross-cutting',
              NFR5:'cross-cutting',
              NFR6:'cross-cutting',
              NFR7:'logic',
              NFR8:'cross-cutting',
              NFR9:'cross-cutting',
            };

            function slugifyHeading(text) {
              return text
                .trim()
                .toLowerCase()
                .replace(/[^\w\s-]/g, '')
                .replace(/\s+/g, '-');
            }

            // Parse markdown requirements with headings like:
            // ### FR1: Public resume access
            // ...body...
            function parseRequirements(md, prefix) {
              const lines = md.split(/\r?\n/);
              const reqs = [];
              let current = null;

              const headingRegex = new RegExp(`^###\\s+(${prefix}\\d+)\\s*:\\s*(.+?)\\s*$`);

              for (const line of lines) {
                const m = line.match(headingRegex);
                if (m) {
                  if (current) reqs.push(current);
                  current = {
                    id: m[1],
                    summary: m[2].trim(),
                    bodyLines: [],
                    headingText: `${m[1]}: ${m[2].trim()}`,
                  };
                  continue;
                }

                if (current) {
                  // stop if next same-level section starts
                  if (line.startsWith('### ')) {
                    reqs.push(current);
                    current = null;
                  } else {
                    current.bodyLines.push(line);
                  }
                }
              }
              if (current) reqs.push(current);

              return reqs.map(r => ({
                ...r,
                body: r.bodyLines.join('\n').trim(),
              }));
            }

            async function ensureLabel(label) {
              try {
                await github.rest.issues.getLabel({
                  owner,
                  repo,
                  name: label.name,
                });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: label.name,
                    color: label.color,
                    description: label.description,
                  });
                  core.info(`Created label: ${label.name}`);
                } else {
                  throw e;
                }
              }
            }

            async function issueExists(title) {
              const q = `repo:${owner}/${repo} is:issue in:title "${title}"`;
              const res = await github.rest.search.issuesAndPullRequests({
                q,
                per_page: 10,
              });
              return res.data.items.some(i => i.title === title);
            }

            function buildArchitectureSectionLink(requirementId) {
              // Map requirement -> architecture section anchor hint (optional refinement)
              // Keeping generic architecture doc link as requested.
              return `${baseBlobUrl}/${architecturePath}`;
            }

            // ---------- Execute ----------
            const functionalMd = fs.readFileSync(functionalPath, 'utf8');
            const nonFunctionalMd = fs.readFileSync(nonFunctionalPath, 'utf8');

            const frs = parseRequirements(functionalMd, 'FR');
            const nfrs = parseRequirements(nonFunctionalMd, 'NFR');

            const requirements = [
              ...frs.map(r => ({ ...r, type: 'functional' })),
              ...nfrs.map(r => ({ ...r, type: 'non-functional' })),
            ];

            if (requirements.length !== 34) {
              core.warning(`Expected 34 requirements, parsed ${requirements.length}. Continuing anyway.`);
            }

            for (const label of REQUIRED_LABELS) {
              await ensureLabel(label);
            }

            let created = 0;
            let skipped = 0;

            for (const req of requirements) {
              const title = `${req.id}: ${req.summary}`;

              if (await issueExists(title)) {
                core.info(`Skipping existing issue: ${title}`);
                skipped++;
                continue;
              }

              const tier = TIER_MAP[req.id] || 'cross-cutting';
              const architectureLink = buildArchitectureSectionLink(req.id);

              const issueBody = [
                `## Requirement`,
                ``,
                `> ${req.body.split('\n').join('\n> ')}`,
                ``,
                `## Architecture Reference`,
                ``,
                `- [Architecture Overview](${architectureLink})`,
                ``,
                `## Metadata`,
                ``,
                `- Requirement ID: \`${req.id}\``,
                `- Requirement Type: \`${req.type}\``,
                `- Tier: \`${tier}\``,
                ``,
                `---`,
                `Source: \`${req.type === 'functional' ? functionalPath : nonFunctionalPath}\``,
              ].join('\n');

              const labels = [
                `type:${req.type}`,
                `tier:${tier}`,
                `status:not-started`,
                `stage:design`,
                `stage:implementation`,
                `stage:testing`,
              ];

              await github.rest.issues.create({
                owner,
                repo,
                title,
                body: issueBody,
                labels,
              });

              core.info(`Created issue: ${title}`);
              created++;
            }

            core.notice(`Done. Created: ${created}, Skipped(existing): ${skipped}`);
