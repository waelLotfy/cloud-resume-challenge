# ============================================================
# Backend deploy: applies the Terraform configuration (infrastructure
# AND the Lambda code, which Terraform packages and deploys) to
# production, then verifies the live API with smoke tests.
#
#   plan (read-only) -> manual approval -> apply -> smoke tests
#
# Lambda code deploys ONLY through terraform apply. Deploying it any
# other way would change the live code hash behind Terraform's back
# and make every drift check fail.
# ============================================================

name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infrastructure/**"
      - ".github/workflows/backend-deploy.yml"

# Default for every job; plan and apply add id-token below.
permissions:
  contents: read

env:
  TF_INPUT: "0"   # Never prompt: a missing value fails fast instead of hanging

# One deploy at a time. A newer push waits instead of cancelling
# an apply that is already in progress.
concurrency:
  group: terraform-prod
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------
  # Job 1: plan with the READ-ONLY role. Nothing is changed here.
  # ----------------------------------------------------------
  plan:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Request the OIDC token
      contents: read
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}   # Lets later jobs skip when there is nothing to deploy
    defaults:
      run:
        working-directory: infrastructure/environments/prod
    steps:
      # Use the same action versions as your other workflows.
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false   # Plain binary, so we read the real exit code ourselves

      - name: Authenticate to AWS via OIDC (plan-only role)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::130165494991:role/github-actions-cloud-resume-plan
          aws-region: eu-central-1

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        id: plan
        run: |
          # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes to apply.
          # -out saves the exact plan so the apply job runs what was reviewed.
          code=0
          terraform plan -no-color -detailed-exitcode -lock-timeout=5m -out=tfplan > plan.txt 2>&1 || code=$?

          # Show the plan on the run page for the reviewer. It is read from a
          # file, never interpolated into this script.
          {
            echo "### Terraform plan (exit code: $code)"
            echo '```'
            head -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          case "$code" in
            0) echo "has_changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "has_changes=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::terraform plan failed. See the run summary."; exit 1 ;;
          esac

      # The apply job runs on a different machine, so the saved plan AND the
      # Lambda zips (built during planning, and gitignored) must travel with it.
      - name: Upload the plan and Lambda packages
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v7   # Bump to the latest major your IDE suggests
        with:
          name: tfplan
          path: |
            infrastructure/environments/prod/tfplan
            backend/*.zip
          if-no-files-found: error
          retention-days: 1

  # ----------------------------------------------------------
  # Job 2: apply the saved plan. Pauses for manual approval.
  # ----------------------------------------------------------
  apply:
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'   # Nothing to deploy -> skipped, no approval prompt
    runs-on: ubuntu-latest
    # Declaring the environment does two things: it pauses here until the
    # required reviewer approves, and it makes GitHub issue the
    # environment-based subject that ONLY the deploy role trusts.
    environment: prod
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infrastructure/environments/prod
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Download AFTER checkout, so checkout cannot clean the files away.
      # With no path set, files land back at their original locations.
      - name: Download the plan and Lambda packages
        uses: actions/download-artifact@v8   # Bump to match upload-artifact
        with:
          name: tfplan

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.2"   # Must match the plan job exactly
          terraform_wrapper: false

      - name: Authenticate to AWS via OIDC (deploy role)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::130165494991:role/github-actions-cloud-resume-deploy
          aws-region: eu-central-1

      - name: Terraform init
        run: terraform init

      # Applying a saved plan needs no -auto-approve: the approval already
      # happened at the environment gate. If state changed since the plan
      # was made, Terraform refuses to apply the stale plan.
      - name: Terraform apply
        run: terraform apply tfplan

  # ----------------------------------------------------------
  # Job 3: verify the live API. Needs no AWS credentials.
  # ----------------------------------------------------------
  smoke-test:
    needs: apply   # Runs only if apply succeeded
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt

      # Tests call the real public API. They increment the live visitor
      # counter each run, which is expected for a smoke test.
      - name: Run smoke tests
        run: python -m pytest tests/integration -v