name: Traceability Check

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/traceability-check.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/traceability-check.yml'

permissions:
  contents: read

jobs:
  check-traceability:
    name: Validate Traceability Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Traceability Validation
        run: python3 scripts/check_traceability.py
